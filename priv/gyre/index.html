<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Gyre</title>
    <!--
      The Gyre, per rfd/0085. Runs standalone: no server, no build step,
      no framework. State persists in localStorage.

      One dependency, ninja-keys (~8-10 KB gzipped), a standalone Web
      Component for the slash-command palette. Everything else is native:
      <table>, custom events, localStorage. This replaces a 919,261-byte
      three.js + SlugHorn WASM client.
    -->
    <script type="module" src="https://unpkg.com/ninja-keys?module"></script>
    <style>
      /*
        Palette sampled from "Secrets of the Silent Witch" OP 1, creditless
        4K, with ffmpeg palettegen, then weighted by screen time across
        1,310,400 sampled pixels:

          #010001  18.1%   near-black, the ground
          #f6f3f1  13.3%   warm white, primary text
          #161c22  12.2%   blue-black panel
          #23374f   6.3%   deep blue line
          #cad7e1   5.5%   pale blue
          #e5d2b4   5.2%   cream -- the warm light
          #94afc8   4.3%   cool blue
          #7390ad   3.8%   mid blue
          #c0a98c   3.6%   tan

        Two hues, not one: cool blue is the dark, warm cream is the light.
        That axis carries the state. A sound Frame reads cool and recedes;
        as it fails it warms, and the brightest cream is the alarm. No red
        or green appears in the source, so none is invented here -- that
        would be a different palette wearing this one's name.
      */
      :root {
        --bg: #010001; --panel: #161c22; --line: #23374f; --fg: #f6f3f1;
        --fg2: #cad7e1; --dim: #7390ad; --cool: #94afc8; --warm: #e5d2b4;
        --ok: #7390ad; --warn: #c0a98c; --bad: #e5d2b4;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg);
             font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }
      header { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap;
               padding: 12px 18px; border-bottom: 1px solid var(--line); }
      h1 { font-size: 14px; margin: 0; letter-spacing: .16em; text-transform: uppercase; }
      .meta { color: var(--dim); font-size: 12px; }
      main { display: grid; grid-template-columns: minmax(0,1.5fr) minmax(0,1fr);
             gap: 16px; padding: 16px; align-items: start; }
      @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
      h2 { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim);
           margin: 0; padding: 9px 12px; border-bottom: 1px solid var(--line); }
      #log { height: 56vh; overflow-y: auto; padding: 12px; }
      .t { margin-bottom: 11px; }
      .echo { color: var(--cool); } .err { color: var(--bad); } .warn { color: var(--warn); }
      .sub { color: var(--fg2); font-size: 12px; opacity: .72; }
      form { display: flex; gap: 8px; padding: 11px; border-top: 1px solid var(--line); }
      input { flex: 1; background: var(--bg); border: 1px solid var(--line); color: var(--fg);
              border-radius: 4px; padding: 8px 10px; font: inherit; }
      button { background: var(--line); color: var(--fg); border: 0; border-radius: 4px;
               padding: 8px 14px; font: inherit; cursor: pointer; }
      button:hover { background: #2b3145; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 6px 12px; border-bottom: 1px solid var(--line); }
      th { color: var(--dim); font-weight: 400; font-size: 11px; letter-spacing: .1em;
           text-transform: uppercase; }
      tbody tr:last-child td, tbody tr:last-child th { border-bottom: 0; }
      td.n { text-align: right; font-variant-numeric: tabular-nums; }
      .empty { color: var(--dim); padding: 11px 12px; font-size: 13px; }
      .bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
      .bar > i { display: block; height: 100%; background: var(--ok); }
      kbd { background: var(--line); border-radius: 3px; padding: 1px 5px; font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <h1>The Gyre</h1>
      <span class="meta"><kbd>/</kbd> commands &middot; <span id="where">—</span></span>
    </header>

    <ninja-keys placeholder="Command..." hideBreadcrumbs></ninja-keys>

    <main>
      <section>
        <h2>Transcript</h2>
        <div id="log"></div>
        <form id="entry" autocomplete="off">
          <input id="line" type="text" placeholder="look, go &lt;place&gt;, take &lt;contract&gt;, work, deliver, repair, pay" />
          <button type="submit">Send</button>
        </form>
      </section>

      <div style="display:grid; gap:16px">
        <section><h2>Spark</h2><table><tbody id="spark"></tbody></table></section>
        <section>
          <h2>Contracts</h2>
          <table>
            <thead><tr><th>Contract</th><th>Site</th><th class="n">Pay</th></tr></thead>
            <tbody id="contracts"></tbody>
          </table>
        </section>
        <section>
          <h2>Salvage</h2>
          <table>
            <thead><tr><th>Item</th><th class="n">Qty</th><th class="n">Value</th></tr></thead>
            <tbody id="inv"></tbody>
          </table>
        </section>
      </div>
    </main>

    <script type="module">
      // ---- world (rfd/0085): Sparks in Frames, gig contracts, a debt clock.
      // Two hubs and two field sites. decanting_floor and splicers_den keep
      // the names the server's gyre_room_templates() used.
      const PLACES = {
        commons:         { hub: true,  name: "The Commons",     desc: "Recycled air, warm plating. Sparks trade rumours under the debt boards.", exits: ["under_market", "decanting_floor"] },
        under_market:    { hub: true,  name: "The Under-Market", desc: "Stalls of scavenged Frame parts. Everything here was somebody once.",   exits: ["commons", "splicers_den"] },
        decanting_floor: { hub: false, name: "Decanting Floor",  desc: "Rows of drained tanks. The ring's outer shell groans through the deck.", exits: ["commons"] },
        splicers_den:    { hub: false, name: "Splicer's Den",    desc: "Cable-lit, low. Somebody is rebuilding a Frame that will not hold.",     exits: ["under_market"] },
      };

      const CONTRACTS = [
        { id: "coolant",  title: "Vent coolant sludge",   site: "decanting_floor", pay: 180, wear: 6,  loot: ["Coolant Sleeve", 40] },
        { id: "tanks",    title: "Tag the dead tanks",    site: "decanting_floor", pay: 240, wear: 9,  loot: ["Tank Seal", 65] },
        { id: "salvage",  title: "Strip a failed Frame",  site: "splicers_den",    pay: 320, wear: 14, loot: ["Frame Coupling", 110] },
        { id: "courier",  title: "Run a memory backup",   site: "splicers_den",    pay: 150, wear: 4,  loot: ["Memory Wafer", 90] },
      ];

      const FRESH = () => ({
        place: "commons", debt: 4200, credits: 60, integrity: 100,
        energy: 10, turn: 0, contract: null, done: 0, inv: {},
      });

      const KEY = "gyre.spark.v1";
      let S = load();

      function load() {
        try {
          const raw = JSON.parse(localStorage.getItem(KEY));
          return raw && raw.place ? { ...FRESH(), ...raw } : FRESH();
        } catch { return FRESH(); }
      }
      const save = () => localStorage.setItem(KEY, JSON.stringify(S));

      // ---- output. textContent only: never build HTML from state.
      const $ = (id) => document.getElementById(id);
      function say(text, sub, cls) {
        const w = document.createElement("div"); w.className = "t";
        const b = document.createElement("div"); if (cls) b.className = cls;
        b.textContent = text; w.appendChild(b);
        if (sub) { const s = document.createElement("div"); s.className = "sub"; s.textContent = sub; w.appendChild(s); }
        $("log").appendChild(w); $("log").scrollTop = $("log").scrollHeight;
      }
      const row = (cells) => {
        const tr = document.createElement("tr");
        for (const [text, cls, head] of cells) {
          const c = document.createElement(head ? "th" : "td");
          if (cls) c.className = cls;
          if (text instanceof Node) c.appendChild(text); else c.textContent = text;
          tr.appendChild(c);
        }
        return tr;
      };

      function render() {
        const p = PLACES[S.place];
        $("where").textContent = p.name + (p.hub ? " (hub)" : " (field)");

        const bar = document.createElement("div");
        bar.className = "bar";
        const i = document.createElement("i");
        i.style.width = Math.max(0, Math.min(100, S.integrity)) + "%";
        if (S.integrity < 30) i.style.background = "var(--bad)";
        else if (S.integrity < 60) i.style.background = "var(--warn)";
        bar.appendChild(i);

        $("spark").replaceChildren(
          row([["Debt", null, true], [S.debt.toLocaleString() + " cr", "n"]]),
          row([["Credits", null, true], [S.credits.toLocaleString() + " cr", "n"]]),
          row([["Frame", null, true], [bar]]),
          row([["Integrity", null, true], [S.integrity + "%", "n"]]),
          row([["Energy", null, true], [S.energy + "/10", "n"]]),
          row([["Contracts done", null, true], [String(S.done), "n"]]),
          row([["Turn", null, true], [String(S.turn), "n"]]),
        );

        const open = CONTRACTS.filter((c) => !S.contract || c.id === S.contract);
        $("contracts").replaceChildren(
          ...(open.length
            ? open.map((c) =>
                row([
                  [(S.contract === c.id ? "* " : "") + c.title],
                  [PLACES[c.site].name],
                  [c.pay + " cr", "n"],
                ]))
            : [row([["none", "empty"]])])
        );

        const items = Object.entries(S.inv);
        $("inv").replaceChildren(
          ...(items.length
            ? items.map(([n, v]) => row([[n], [String(v.qty), "n"], [v.value * v.qty + " cr", "n"]]))
            : [row([["nothing salvaged", "empty"]])])
        );
        save();
      }

      // ---- the loop. Every action costs a turn; the debt accrues on the tick.
      function tick(cost = 1) {
        S.turn += 1;
        S.energy = Math.min(10, S.energy + 1);
        S.debt += Math.ceil(S.debt * 0.004); // the clock never stops
        if (cost) S.energy -= cost;
      }

      const look = () => {
        const p = PLACES[S.place];
        say(p.name, p.desc);
        say("Exits: " + p.exits.map((e) => PLACES[e].name).join(", "), null, "sub");
      };

      const CMD = {
        look, l: look,

        go(args) {
          const want = (args.join(" ") || "").toLowerCase().replace(/\s+/g, "_");
          const p = PLACES[S.place];
          const dest = p.exits.find((e) => e === want || PLACES[e].name.toLowerCase().includes(want));
          if (!dest) return say("No way through to that.", "exits: " + p.exits.join(", "), "err");
          if (S.energy < 1) return say("The Frame will not move. Rest a turn.", null, "warn");
          tick(1); S.place = dest; look();
        },

        take(args) {
          if (S.contract) return say("You already carry a contract. Work it or drop it.", null, "warn");
          const want = (args[0] || "").toLowerCase();
          const c = CONTRACTS.find((x) => x.id === want || x.title.toLowerCase().includes(want));
          if (!c) return say("No such contract on the boards.", "try: " + CONTRACTS.map((x) => x.id).join(", "), "err");
          if (!PLACES[S.place].hub) return say("Contracts are posted in the hubs, not out here.", null, "warn");
          tick(0); S.contract = c.id;
          say("Signed: " + c.title, "site: " + PLACES[c.site].name + "  pay: " + c.pay + " cr");
        },

        drop() {
          if (!S.contract) return say("You carry no contract.", null, "warn");
          const c = CONTRACTS.find((x) => x.id === S.contract);
          tick(0); S.contract = null;
          say("Dropped: " + c.title, "the board keeps a note of it", "warn");
        },

        work() {
          if (!S.contract) return say("No contract to work.", null, "warn");
          const c = CONTRACTS.find((x) => x.id === S.contract);
          if (S.place !== c.site) return say("Wrong site. " + c.title + " is at " + PLACES[c.site].name + ".", null, "warn");
          if (S.energy < 2) return say("Not enough left in the Frame. Rest.", null, "warn");
          tick(2);
          S.integrity = Math.max(0, S.integrity - c.wear);
          const [item, value] = c.loot;
          S.inv[item] = { qty: (S.inv[item]?.qty || 0) + 1, value };
          say("Worked: " + c.title, "Frame integrity -" + c.wear + "%  salvaged " + item);
          if (S.integrity <= 0) {
            say("The Frame fails. You are decanted into a fresh one, and billed for it.", "debt +1200 cr", "bad");
            S.debt += 1200; S.integrity = 100; S.place = "decanting_floor"; S.contract = null;
          }
        },

        deliver() {
          if (!S.contract) return say("No contract to deliver.", null, "warn");
          if (!PLACES[S.place].hub) return say("Deliver at a hub.", null, "warn");
          const c = CONTRACTS.find((x) => x.id === S.contract);
          tick(1); S.credits += c.pay; S.done += 1; S.contract = null;
          say("Delivered: " + c.title, "+" + c.pay + " cr");
        },

        repair() {
          const cost = 120, gain = 25;
          if (!PLACES[S.place].hub) return say("Splicers work the hubs.", null, "warn");
          if (S.credits < cost) return say("Not enough credits. " + cost + " cr for a patch.", null, "warn");
          if (S.integrity >= 100) return say("The Frame is sound.", null, "warn");
          tick(1); S.credits -= cost; S.integrity = Math.min(100, S.integrity + gain);
          say("Patched the Frame.", "-" + cost + " cr, integrity +" + gain + "%");
        },

        pay(args) {
          const amt = Math.max(0, Math.min(parseInt(args[0] || "0", 10) || 0, S.credits, S.debt));
          if (!amt) return say("Pay how much? You hold " + S.credits + " cr.", null, "warn");
          tick(0); S.credits -= amt; S.debt -= amt;
          say("Paid " + amt + " cr against the debt.", S.debt + " cr remaining");
          if (S.debt === 0) say("The debt clock stops. You are nobody's asset now.", "the Gyre keeps turning", "ok");
        },

        sell() {
          const items = Object.entries(S.inv);
          if (!items.length) return say("Nothing to sell.", null, "warn");
          if (S.place !== "under_market") return say("Salvage moves at the Under-Market.", null, "warn");
          const total = items.reduce((n, [, v]) => n + v.qty * v.value, 0);
          tick(1); S.credits += total; S.inv = {};
          say("Sold the lot.", "+" + total + " cr");
        },

        rest() { tick(0); say("You idle a turn. The debt does not.", "energy " + S.energy + "/10"); },

        status() { say("Spark status", "see the panels"); },

        reset() { S = FRESH(); say("Decanted fresh. Everything forgotten.", null, "warn"); look(); },

        help() {
          say("Commands", "look, go <place>, take <contract>, drop, work, deliver, repair, sell, pay <n>, rest, reset");
        },
      };

      function run(raw) {
        const t = raw.trim().split(/\s+/).filter(Boolean);
        if (!t.length) return;
        say("> " + raw, null, "echo");
        const fn = CMD[t[0].toLowerCase()];
        if (!fn) return say("The Gyre does not know that word.", "try: help", "err");
        fn(t.slice(1));
        render();
      }

      $("entry").addEventListener("submit", (e) => {
        e.preventDefault();
        const v = $("line").value.trim();
        if (!v) return;
        $("line").value = "";
        run(v);
      });

      const ninja = document.querySelector("ninja-keys");
      ninja.data = [
        { id: "look", title: "look — describe where you stand", section: "Move", handler: () => run("look") },
        { id: "commons", title: "go Commons", section: "Move", handler: () => run("go commons") },
        { id: "market", title: "go Under-Market", section: "Move", handler: () => run("go under_market") },
        { id: "decant", title: "go Decanting Floor", section: "Move", handler: () => run("go decanting_floor") },
        { id: "den", title: "go Splicer's Den", section: "Move", handler: () => run("go splicers_den") },
        { id: "work", title: "work — labour the contract", section: "Contract", handler: () => run("work") },
        { id: "deliver", title: "deliver — hand it in at a hub", section: "Contract", handler: () => run("deliver") },
        { id: "sell", title: "sell — move salvage at the Under-Market", section: "Credits", handler: () => run("sell") },
        { id: "repair", title: "repair — patch the Frame", section: "Credits", handler: () => run("repair") },
        { id: "help", title: "help — list every command", section: "Meta", handler: () => run("help") },
      ];

      addEventListener("keydown", (e) => {
        if (e.key === "/" && document.activeElement !== $("line")) { e.preventDefault(); ninja.open(); }
      });

      say("You come up in a borrowed Frame, already owing.", "rfd/0085 — type help, or press / ");
      look();
      render();
    </script>
  </body>
</html>
